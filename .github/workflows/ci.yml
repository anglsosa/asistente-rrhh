name: CI

on:
    pull_request:
        branches: [develop, main]

jobs:
    backend:
        name: Backend · lint y pruebas
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v7.0.1

            - name: Instala uv
              uses: astral-sh/setup-uv@v10.4.0
              with:
                  enable-cache: true

            - name: Instala dependencias exactas del lock
              run: uv sync --locked

            - name: Lint
              run: uv run ruff check .

            - name: Formato
              run: uv run ruff format --check .

            - name: Pruebas
              run: uv run pytest -q
      frontend:
        name: Frontend lint y build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - run: npm ci
            - run: npm run lint
            - run: npm run build
